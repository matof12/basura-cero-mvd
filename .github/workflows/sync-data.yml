name: Sync CKAN Data

on:
  schedule:
    - cron: '0 * * * *'   # cada hora en punto
  workflow_dispatch:        # también se puede lanzar manualmente desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install sync dependencies
        run: npm install jszip
        working-directory: scripts

      - name: Run sync script
        run: node scripts/sync.js

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data/containers.json
          git diff --staged --quiet || git commit -m "chore: sync data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push